name: Feature request
description: Propose a focused product improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What problem or reading workflow should improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy, accessibility, and offline considerations
      description: Note AI data sharing, local storage, keyboard/VoiceOver, reduced motion, or offline impact.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests first.
          required: true
